# Сборка Kadr для Windows: тесты → FFmpeg → PyInstaller → установщик Inno Setup.
# Готовые файлы — во вкладке Actions (артефакт «Kadr-Windows»).
# Релиз: Actions → Windows build → Run workflow → указать версию (например 1.1.0)
# или запушить тег вида v1.1.0 — установщик появится в разделе Releases.
name: Windows build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например 1.1.0 (пусто — просто сборка без релиза)"
        required: false
        default: ""

permissions:
  contents: write   # нужно только для публикации релиза по тегу

env:
  PYTHONUTF8: "1"   # кириллица в выводе скриптов на консоли cp1252
  # Версия из формы «Run workflow»; для тегов build.py берёт её из имени тега
  KADR_VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка номера версии
        if: env.KADR_VERSION != ''
        shell: pwsh
        run: |
          if ($env:KADR_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Версия должна быть вида 1.2.3, получено: $env:KADR_VERSION" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: FFmpeg
        run: python scripts/fetch_ffmpeg.py

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Сборка
        run: python scripts/build.py

      - name: Сквозная проверка Kadr.exe на Windows
        run: python scripts/smoke_exe.py dist/Kadr/Kadr.exe

      - name: Проверка сборки
        shell: pwsh
        run: |
          foreach ($f in "dist\Kadr\Kadr.exe", "dist\Kadr\_internal\kadr\bin\ffmpeg.exe", "dist\Kadr-Setup.exe", "dist\Kadr-portable.zip") {
            if (-not (Test-Path $f)) { throw "Нет файла $f" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-Windows
          path: |
            dist/Kadr-Setup.exe
            dist/Kadr-portable.zip

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') || env.KADR_VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          # При запуске из формы тег создаётся здесь же, на собранном коммите
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.KADR_VERSION) }}
          target_commitish: ${{ github.sha }}
          name: Kadr ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.KADR_VERSION) }}
          generate_release_notes: true
          body: |
            **Скачайте `Kadr-Setup.exe`** и запустите — программа установится с ярлыками на рабочем столе и в «Пуске».
            `Kadr-portable.zip` — версия без установки: распакуйте и запустите `Kadr.exe`.
            Если Windows SmartScreen предупредит о неизвестном издателе: «Подробнее» → «Выполнить в любом случае».
          files: |
            dist/Kadr-Setup.exe
            dist/Kadr-portable.zip
