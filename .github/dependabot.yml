# Dependabot: раз в неделю проверяет зависимости и присылает PR с обновлениями.
# Обновления, закрывающие уязвимости, приходят сразу (Security → Dependabot alerts).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
