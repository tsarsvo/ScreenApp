# Настройки инструментов качества кода. Само приложение ставится из requirements.txt.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# F — ошибки (неиспользуемое, неопределённые имена), E9 — синтаксис,
# B — частые баги (bugbear), UP — устаревший синтаксис, SIM — упрощения,
# S — безопасность (правила bandit)
select = ["F", "E9", "B", "UP", "SIM", "S"]
ignore = [
    "S603",   # subprocess со списком аргументов, без shell=True (shell=True ловит S602)
    "S110",   # try/except/pass — намеренно там, где действие «по возможности» (уборка, откат)
    "S112",   # то же с continue: пропустить экран/файл, который не удалось прочитать
]

[tool.ruff.lint.per-file-ignores]
# в тестах assert — это суть теста; утилиты и временные пути — нормально
"tests/**" = ["S101", "S108", "S607"]
# служебные скрипты сборки и проверки вызывают системные утилиты по имени (tasklist, iscc…)
"scripts/**" = ["S607"]
